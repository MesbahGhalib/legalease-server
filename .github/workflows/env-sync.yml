name: Sync Prod Env → Vercel

# GitHub Secrets set via `env:` on the vercel deploy job never reach Vercel's
# remote build/runtime — Vercel only reads its own project env vars. This
# workflow pushes the runtime secrets into the Vercel production environment
# via the Vercel REST API, then redeploys so the new values take effect.
# Secret values are never printed: GitHub masks them and the script only
# reports set/skip status.

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/env-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    name: Sync backend runtime environment to Vercel prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync environment into Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          # Core runtime secrets (previously missing - root cause of 500 errors)
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ORIGINS: ${{ secrets.CLIENT_ORIGINS }}
          COOKIE_NAME: ${{ secrets.COOKIE_NAME }}
          # Google OAuth
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ONBOARDING_SECRET: ${{ secrets.GOOGLE_ONBOARDING_SECRET }}
          # Stripe
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CURRENCY: ${{ secrets.STRIPE_CURRENCY }}
          LAWYER_PUBLISHING_FEE_CENTS: ${{ secrets.LAWYER_PUBLISHING_FEE_CENTS }}
          # Image uploads
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # Admin seed account
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Email (Resend SMTP)
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          # SSLCommerz
          SSCOMMERZ_STORE_ID: ${{ secrets.SSCOMMERZ_STORE_ID }}
          SSCOMMERZ_STORE_PASSWORD: ${{ secrets.SSCOMMERZ_STORE_PASSWORD }}
          SSCOMMERZ_SANDBOX: ${{ secrets.SSCOMMERZ_SANDBOX }}
          SSCOMMERZ_USD_TO_BDT_RATE: ${{ secrets.SSCOMMERZ_USD_TO_BDT_RATE }}
          # Vonage SMS
          VONAGE_API_KEY: ${{ secrets.VONAGE_API_KEY }}
          VONAGE_API_SECRET: ${{ secrets.VONAGE_API_SECRET }}
          VONAGE_FROM_NUMBER: ${{ secrets.VONAGE_FROM_NUMBER }}
          # Observability
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENV_SPEC: >-
            MONGODB_URI,
            MONGODB_DB_NAME,
            JWT_SECRET,
            CLIENT_ORIGINS,
            COOKIE_NAME,
            GOOGLE_CLIENT_ID,
            GOOGLE_ONBOARDING_SECRET,
            STRIPE_SECRET_KEY,
            STRIPE_WEBHOOK_SECRET,
            STRIPE_CURRENCY,
            LAWYER_PUBLISHING_FEE_CENTS,
            IMGBB_API_KEY,
            ADMIN_NAME,
            ADMIN_EMAIL,
            ADMIN_PASSWORD,
            EMAIL_HOST,
            EMAIL_PORT,
            EMAIL_USER,
            EMAIL_PASS,
            EMAIL_FROM,
            SERVER_URL,
            SSCOMMERZ_STORE_ID,
            SSCOMMERZ_STORE_PASSWORD,
            SSCOMMERZ_SANDBOX,
            SSCOMMERZ_USD_TO_BDT_RATE,
            VONAGE_API_KEY,
            VONAGE_API_SECRET,
            VONAGE_FROM_NUMBER,
            SENTRY_DSN
        run: |
          cat > /tmp/vercel-env-sync.mjs << 'EOF'
          const token = process.env.VERCEL_TOKEN
          const teamId = process.env.VERCEL_ORG_ID
          const projectId = process.env.VERCEL_PROJECT_ID
          if (!token || !teamId || !projectId) {
            console.error('Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_BACKEND_PROJECT_ID')
            process.exit(1)
          }
          const names = process.env.ENV_SPEC.split(',').map(s => s.trim()).filter(Boolean)
          const api = (path, opts = {}) =>
            fetch(`https://api.vercel.com${path}${path.includes('?') ? '&' : '?'}teamId=${teamId}`, {
              ...opts,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
            }).then(async r => ({ status: r.status, body: await r.text() }))

          let setCount = 0
          for (const name of names) {
            const value = process.env[name]
            if (!value) { console.log(`SKIP ${name} (not set in GitHub Secrets)`); continue }
            const res = await api(`/v9/projects/${projectId}/env?upsert=true&target=production`, {
              method: 'POST',
              body: JSON.stringify({ key: name, value, type: 'encrypted', target: ['production'] })
            })
            if (res.status === 201 || res.status === 200) { console.log(`SET ${name} (production)`); setCount++ }
            else console.log(`WARN ${name} -> HTTP ${res.status}: ${res.body.slice(0, 200)}`)
          }
          console.log(`Synced ${setCount}/${names.length} variables`)
          EOF
          node /tmp/vercel-env-sync.mjs

      - name: Redeploy production with new env
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
